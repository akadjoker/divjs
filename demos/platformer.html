<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS — Platformer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 6px;
    }
    canvas { display: block; border: 1px solid #1a2040; }
    p { color: #445; font: 11px monospace; text-align: center; }
    .error { color: #f87171; }
  </style>
</head>
<body>
<canvas id="c" width="480" height="400"></canvas>
<p id="error" class="error" hidden></p>
<p>← → mover · ↑ / Z saltar · ESPAÇO / X atirar</p>

<script type="module">
import { runDivDemo } from '../divjs.js';

// The DIV program lives in playground/programs/platformer.div, shared with the
// online playground so there is a single copy of it.
const source = await (await fetch('../playground/programs/platformer.div')).text();
const errorEl = document.getElementById('error');

// Exposed so the running program can be inspected from the browser console.
window.divDemo = runDivDemo({
  canvas: 'c',
  source,
  clearColor: '#0a0a14',
  onError: (err) =>
  {
    errorEl.textContent = err?.message || String(err);
    errorEl.hidden = false;
    console.error(err);
  }
});
</script>
</body>
</html>
