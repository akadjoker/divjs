<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS - Pathfind Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a111a;
      color: #d7e6f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 12px;
    }
    canvas {
      display: block;
      border: 1px solid #2b4158;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0e1a29;
    }
    p {
      color: #93aecd;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      text-align: center;
      max-width: 820px;
      line-height: 1.4;
    }
    #log {
      width: 860px;
      max-width: 100%;
      background: #0f1b2a;
      border: 1px solid #2a3f55;
      padding: 8px;
      min-height: 52px;
      color: #9bc8f2;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="c" width="860" height="520"></canvas>
  <p>
    Clique esquerdo para escolher destino. O bot recalcula path A* em grelha, desviando dos blocos (TYPE wall).
  </p>
  <div id="log">booting...</div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const SOURCE = `PROGRAM pathfind_demo;

GLOBAL g_target_x = 760;
GLOBAL g_target_y = 440;
GLOBAL g_path = 0;
GLOBAL g_path_len = 0;
GLOBAL g_path_idx = 1;
GLOBAL g_repath_cd = 0;
GLOBAL g_grid = 16;
GLOBAL g_diag = 1;
GLOBAL g_wall_type = 0;
GLOBAL g_mouse_prev = 0;
GLOBAL g_last_repath_ok = 0;
GLOBAL g_step_state = 0;

PROCESS wall(px, py, w, h);
BEGIN
  x = px;
  y = py;
  width = w;
  height = h;

  LOOP
    set_color('#37506a');
    draw_rect(x, y, width, height);

    set_color('#5a7c9d');
    draw_rect(x + 2, y + 2, width - 4, height - 4);

    FRAME;
  END
END

PROCESS bot();
PRIVATE speed = 130; ang = 0; eye_x = 0; eye_y = 0;
BEGIN
  x = 60;
  y = 60;
  width = 16;
  height = 16;

  LOOP
    IF (g_repath_cd <= 0)
      IF (g_path) path_clear(g_path); END

      g_path = path_find(x + 8, y + 8, g_target_x, g_target_y, g_wall_type, g_grid, g_diag, 8192);
      g_path_len = path_length(g_path);
      g_last_repath_ok = 0;
      IF (g_path)
        g_last_repath_ok = path_assign(g_path, 1);
      END
      g_repath_cd = 0.22;
    ELSE
      g_repath_cd = g_repath_cd - get_delta();
    END

    g_step_state = path_step(speed, 2);
    g_path_idx = path_index();

    IF (g_path_idx < g_path_len)
      ang = atan2(path_get_y(g_path, g_path_idx) - (y + 8), path_get_x(g_path, g_path_idx) - (x + 8));
      angle = ang;
    END

    set_color('#6bff99');
    draw_rect(x, y, width, height);

    eye_x = x + 8 + cos(ang) * 5;
    eye_y = y + 8 + sin(ang) * 5;
    set_color('#eafff3');
    circle(eye_x, eye_y, 2);

    set_color('#143925');
    circle(x + 8, y + 8, 3);

    FRAME;
  END
END

BEGIN
  set_mode(860, 520);
  screen_color('#0e1a29');

  g_wall_type = TYPE wall;

  wall(180, 40, 24, 360);
  wall(320, 160, 24, 300);
  wall(470, 40, 24, 260);
  wall(620, 210, 24, 270);
  wall(730, 60, 24, 210);
  wall(80, 260, 180, 24);
  wall(410, 340, 170, 24);

  bot();

  LOOP
    IF (mouse_button(0))
      IF (g_mouse_prev == 0)
        g_target_x = mouse_x();
        g_target_y = mouse_y();
        g_repath_cd = 0;
      END
      g_mouse_prev = 1;
    ELSE
      g_mouse_prev = 0;
    END

    IF (g_path)
      FOR i = 0 TO g_path_len - 1
        set_color('#5cc6ff');
        circle(path_get_x(g_path, i), path_get_y(g_path, i), 2);
      END
    END

    set_color('#ffcf5a');
    circle(g_target_x, g_target_y, 6);

    write(0, 16, 14, 0, 'PATHFIND DEMO (A* GRID)');
    write(0, 16, 34, 0, 'click: new target');
    write(0, 16, 54, 0, 'path points:');
    write_int(0, 130, 54, 0, g_path_len);
    write(0, 16, 74, 0, 'path id:');
    write_int(0, 130, 74, 0, g_path);
    write(0, 16, 94, 0, 'repath ok:');
    write_int(0, 130, 94, 0, g_last_repath_ok);
    write(0, 16, 114, 0, 'path idx:');
    write_int(0, 130, 114, 0, g_path_idx);
    write(0, 16, 134, 0, 'step state:');
    write_int(0, 130, 134, 0, g_step_state);

    FRAME;
  END
END`;

    const canvas = document.getElementById('c');
    const log = document.getElementById('log');

    function logLine(line) {
      log.textContent = String(line);
    }

    try {
      runDivDemo({
        canvas,
        source: SOURCE,
        clearColor: '#0e1a29',
        onLog: (line) => { logLine(line); },
        onError: (err) => {
          logLine('error: ' + (err?.message || String(err)));
          console.error(err);
        }
      });
      logLine('running: path_find + path_get_x/y + path_length');
    } catch (err) {
      logLine('error: ' + (err?.message || String(err)));
      console.error(err);
    }
  </script>
</body>
</html>
