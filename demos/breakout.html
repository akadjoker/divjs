<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS — Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 8px;
    }
    canvas { display: block; border: 1px solid #25384d; }
    p {
      color: #6b8cad;
      font: 12px/1.4 "JetBrains Mono", monospace;
      text-align: center;
    }
  </style>
</head>
<body>
<canvas id="c" width="480" height="520"></canvas>
<p>← → ou A D para mover · ESPAÇO para lançar a bola</p>

<script type="module">
import { Lexer }    from '../compiler/tokenizer.js';
import { Parser }   from '../parser/parser.js';
import { Compiler } from '../compiler/compiler.js';
import { VM }       from '../vm/vm.js';
import { CanvasEngineRuntime } from '../vm/runtime.js';

// ── DIV source ────────────────────────────────────────────────────────────
const SOURCE = `PROGRAM breakout;

GLOBAL g_ball   = 0;
GLOBAL g_paddle = 0;
GLOBAL g_brick  = 0;
GLOBAL g_spark  = 0;

GLOBAL score    = 0;
GLOBAL lives    = 3;
GLOBAL launched = 0;
GLOBAL bricks_left = 0;

STRUCT bricks[40]
  active;
  col;
END

FUNCTION make_sprites();
BEGIN
  g_ball = new_graphic(14, 14);
  gfx_fill_rgba(g_ball, 0, 0, 0, 0);
  gfx_circle(g_ball, 7, 7, 6, 255, 220, 60);
  gfx_circle_outline(g_ball, 7, 7, 6, 200, 160, 30);

  g_paddle = new_graphic(64, 14);
  gfx_fill_rgba(g_paddle, 0, 0, 0, 0);
  gfx_rect(g_paddle, 0, 0, 64, 14, 60, 140, 255);
  gfx_rect(g_paddle, 2, 2, 60, 10, 120, 180, 255);
  gfx_rect_outline(g_paddle, 0, 0, 64, 14, 200, 230, 255);

  g_spark = new_graphic(6, 6);
  gfx_fill_rgba(g_spark, 0, 0, 0, 0);
  gfx_circle(g_spark, 3, 3, 2, 255, 255, 180);

  return 0;
END

FUNCTION make_brick(col);
BEGIN
  g = new_graphic(44, 18);
  gfx_fill_rgba(g, 0, 0, 0, 0);
  IF (col == 0) gfx_rect(g, 0, 0, 44, 18, 220, 60, 60);  END
  IF (col == 1) gfx_rect(g, 0, 0, 44, 18, 220, 140, 60); END
  IF (col == 2) gfx_rect(g, 0, 0, 44, 18, 60, 200, 80);  END
  IF (col == 3) gfx_rect(g, 0, 0, 44, 18, 60, 140, 220); END
  IF (col == 4) gfx_rect(g, 0, 0, 44, 18, 180, 60, 220); END
  gfx_rect(g, 2, 2, 40, 14, 255, 255, 255);
  IF (col == 0) gfx_rect(g, 2, 2, 40, 14, 240, 100, 100); END
  IF (col == 1) gfx_rect(g, 2, 2, 40, 14, 240, 180, 100); END
  IF (col == 2) gfx_rect(g, 2, 2, 40, 14, 100, 220, 120); END
  IF (col == 3) gfx_rect(g, 2, 2, 40, 14, 100, 180, 240); END
  IF (col == 4) gfx_rect(g, 2, 2, 40, 14, 220, 100, 240); END
  gfx_rect_outline(g, 0, 0, 44, 18, 40, 40, 40);
  RETURN g;
END

PROCESS spark(px, py, vx, vy);
PRIVATE life = 8;
BEGIN
  x = px; y = py; graph = g_spark;
  LOOP
    x = x + vx;
    y = y + vy;
    vy = vy + 1;
    life = life - 1;
    alpha = life * 12;
    IF (life <= 0) BREAK; END
    FRAME(60);
  END
END

PROCESS brick(bx, by, idx);
BEGIN
  x = bx; y = by;
  width = 44; height = 18;
  graph = make_brick(bricks[idx].col);
  LOOP FRAME; END
END

PROCESS ball();
PRIVATE vx = 3; vy = -4;
BEGIN
  x = 240; y = 400;
  width = 14; height = 14;
  graph = g_ball;
  LOOP
    IF (launched == 0)
      IF (key(_space)) launched = 1; END
      FRAME;
    END
    x = x + vx;
    y = y + vy;
    IF (x < 7)      x = 7;      vx = abs(vx); END
    IF (x > 473)    x = 473;    vx = -abs(vx); END
    IF (y < 14)     y = 14;     vy = abs(vy); END
    hit = collision(TYPE paddle);
    IF (hit)
      vy = -abs(vy);
      y = y - 4;
    END
    hit = collision(TYPE brick);
    IF (hit)
      bi = 0;
      FOR bi = 0 TO 39
        IF (bricks[bi].active == hit)
          bricks[bi].active = 0;
          bricks_left = bricks_left - 1;
          score = score + (bricks[bi].col + 1) * 10;
        END
      END
      vy = -vy;
      signal(hit, S_KILL);
      spark(x - 10, y, -2, -3);
      spark(x,      y, 0,  -4);
      spark(x + 10, y, 2,  -3);
    END
    IF (y > 530)
      lives = lives - 1;
      launched = 0;
      x = 240; y = 400;
      vx = 3; vy = -4;
    END
    FRAME;
  END
END

PROCESS paddle();
PRIVATE spd = 5;
BEGIN
  x = 240; y = 460;
  width = 64; height = 14;
  graph = g_paddle;
  LOOP
    IF (key(_left)  OR key(_a)) x = x - spd; END
    IF (key(_right) OR key(_d)) x = x + spd; END
    IF (x < 32)  x = 32;  END
    IF (x > 448) x = 448; END
          
    FRAME;
  END
END

PROCESS hud();
BEGIN
  LOOP
    write_int(0, 8, 500, 0, score);
    write_int(0, 400, 500, 0, lives);
    FRAME;
  END
END

BEGIN
  set_mode(480, 520);
  screen_color('#0d1520');
  make_sprites();

  bi = 0;
  row = 0;
  col_idx = 0;
  FOR row = 0 TO 7
    FOR col_idx = 0 TO 4
      bi = row * 5 + col_idx;
      bricks[bi].col = row / 2;
      bricks[bi].active = brick(28 + col_idx * 48, 40 + row * 24, bi);
      bricks_left = bricks_left + 1;
    END
  END

  paddle();
  ball();
  hud();

  fade_off(100);
  fade_on(3);

  LOOP
    IF (bricks_left <= 0)
      fade_off(2);
      WHILE (is_fading()) FRAME; END
      text(0, 240, 260, 4, "YOU WIN!");
      FRAME;
    END

    spark(mouse_x(),      mouse_y(), 0,  6);

    IF (lives <= 0)
      fade_off(2);
      WHILE (is_fading()) FRAME; END
      text(0, 240, 260, 4, "GAME OVER");
      FRAME;
    END
    FRAME;
  END
END`;

// ── Bootstrap ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let bytecode;
try {
  bytecode = new Compiler().compile(new Parser(new Lexer(SOURCE).tokenize()).parse());
} catch (err) {
  ctx.fillStyle = '#f87171';
  ctx.font = '13px monospace';
  ctx.fillText('Compile error: ' + err.message, 8, 20);
  throw err;
}

const vm      = new VM();
vm.load(bytecode);
const runtime = new CanvasEngineRuntime({ vm, ctx, width: 480, height: 520, clearColor: '#0d1520' });
runtime.registerNatives();

// key() receives the exact key string from the constant (e.g. 'ArrowLeft', 'a', ' ')
const keys = new Set();
window.addEventListener('keydown', e => { keys.add(e.key); if ([' ','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault(); });
window.addEventListener('keyup',   e => keys.delete(e.key));
vm.registerNative('key', name => keys.has(String(name)) ? 1 : 0);

let lastTs = 0;
function loop(ts) {
  const dt = lastTs === 0 ? 1/60 : (ts - lastTs) / 1000;
  lastTs = ts;
  runtime.beginFrame(dt);
  vm.tick();
  runtime.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
