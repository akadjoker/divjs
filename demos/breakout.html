<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS — Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 8px;
    }
    canvas { display: block; border: 1px solid #25384d; }
    p {
      color: #6b8cad;
      font: 12px/1.4 "JetBrains Mono", monospace;
      text-align: center;
    }
    .error { color: #f87171; }
  </style>
</head>
<body>
<canvas id="c" width="480" height="520"></canvas>
<p id="error" class="error" hidden></p>
<p>← → ou A D para mover · ESPAÇO para lançar a bola</p>

<script type="module">
import { runDivDemo } from '../divjs.js';

// The DIV program lives in playground/programs/breakout.div, shared with the
// online playground so there is a single copy of it.
const source = await (await fetch('../playground/programs/breakout.div')).text();
const errorEl = document.getElementById('error');

// Exposed so the running program can be inspected from the browser console.
window.divDemo = runDivDemo({
  canvas: 'c',
  source,
  clearColor: '#0d1520',
  onError: (err) =>
  {
    errorEl.textContent = err?.message || String(err);
    errorEl.hidden = false;
    console.error(err);
  }
});
</script>
</body>
</html>
