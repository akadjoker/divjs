<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS Bunnymark</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1117;
      color: #dbe8f6;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 10px;
      padding: 12px;
    }
    .stage {
      position: relative;
      border: 1px solid #25384d;
    }
    canvas { display: block; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #131d2a;
      color: #dbe8f6;
      border: 1px solid #2a3f55;
      border-radius: 4px;
      padding: 6px 16px;
      font: 600 13px "Fira Sans", "Segoe UI", sans-serif;
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover { background: #1d2d40; }
    button.active { background: #1a4a2a; border-color: #2e7d4f; color: #86efac; }
    #stats {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(6,10,18,0.80);
      padding: 6px 10px;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      line-height: 1.6;
      pointer-events: none;
      border-radius: 3px;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7,12,20,0.9);
      font-size: 15px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="stage">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="stats">Loading...</div>
  <div id="loading">Loading wabbit...</div>
</div>

<div class="controls">
  <button id="btn50">+50 bunnies</button>
  <button id="btn500">+500 bunnies</button>
  <button id="btnRender" class="active">Render ON</button>
</div>

<script type="module">
import { Lexer }    from '../compiler/tokenizer.js';
import { Parser }   from '../parser/parser.js';
import { Compiler } from '../compiler/compiler.js';
import { VM }       from '../vm/vm.js';
import { CanvasEngineRuntime } from '../vm/runtime.js';

// ── DIV source ────────────────────────────────────────────────────────────────
// The DIV program lives in playground/programs/bunnymark.div, shared with
// the online playground so there is a single copy of it. This page keeps
// its own loop so it can time the VM and the renderer separately.
const SOURCE = await (await fetch('../playground/programs/bunnymark.div')).text();

// ── Bootstrap ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const loadingEl = document.getElementById('loading');
const statsEl   = document.getElementById('stats');

let bytecode;
try {
  bytecode = new Compiler().compile(
    new Parser(new Lexer(SOURCE).tokenize()).parse()
  );
} catch (err) {
  statsEl.textContent = 'Compile error: ' + err.message;
  loadingEl.classList.add('hidden');
  throw err;
}

// globals uses integer indices: bytecode.globals = {name: index}
const gIdx = bytecode.globals;
const getGlobal = (name)      => vm.globals.get(gIdx[name]) ?? 0;
const setGlobal = (name, val) => vm.globals.set(gIdx[name], val);

const vm      = new VM();
vm.load(bytecode);

const runtime = new CanvasEngineRuntime({ vm, ctx, width: 800, height: 600, clearColor: '#1a2030' });
runtime.registerNatives();

// Keyboard for the program's own keys (1: +50, 2: +500). event.code keeps a
// key from sticking when Shift changes between press and release.
window.addEventListener('keydown', (e) => runtime.setKeyState(e.key, true, e.code));
window.addEventListener('keyup', (e) => runtime.setKeyState(e.key, false, e.code));
window.addEventListener('blur', () => runtime.clearKeyState());

loadingEl.classList.add('hidden');

// ── Controls ──────────────────────────────────────────────────────────────────
let renderEnabled = true;

document.getElementById('btn50').addEventListener('click', () => {
  setGlobal('add_queue', getGlobal('add_queue') + 50);
});
document.getElementById('btn500').addEventListener('click', () => {
  setGlobal('add_queue', getGlobal('add_queue') + 500);
});
const btnRender = document.getElementById('btnRender');
btnRender.addEventListener('click', () => {
  renderEnabled = !renderEnabled;
  btnRender.textContent = renderEnabled ? 'Render ON' : 'Render OFF';
  btnRender.classList.toggle('active', renderEnabled);
});

// ── Game loop ─────────────────────────────────────────────────────────────────
let lastTs = 0;
// Rolling average over 60 frames for stable FPS/ms display
const WINDOW = 60;
const tickTimes   = new Float64Array(WINDOW);
const renderTimes = new Float64Array(WINDOW);
let frameIdx = 0;

function loop(ts) {
  const dt = lastTs === 0 ? 1 / 60 : (ts - lastTs) / 1000;
  lastTs = ts;
  runtime.beginFrame(dt);

  const t0 = performance.now();
  vm.tick();
  const t1 = performance.now();
  if (renderEnabled) {
    runtime.render();
  } else {
    ctx.fillStyle = '#1a2030';
    ctx.fillRect(0, 0, 800, 600);
  }
  const t2 = performance.now();

  tickTimes[frameIdx % WINDOW]   = t1 - t0;
  renderTimes[frameIdx % WINDOW] = t2 - t1;
  frameIdx++;

  // Update stats every 20 frames
  if (frameIdx % 20 === 0) {
    const n   = Math.min(frameIdx, WINDOW);
    const avg = (arr) => { let s = 0; for (let i = 0; i < n; i++) s += arr[i]; return s / n; };
    const tms = avg(tickTimes);
    const rms = avg(renderTimes);
    const fps = Math.round(1000 / (tms + (renderEnabled ? rms : 1000/60)));
    statsEl.textContent =
      `bunnies : ${getGlobal('g_count')}\n` +
      `vm tick : ${tms.toFixed(2)} ms\n` +
      `render  : ${renderEnabled ? rms.toFixed(2) + ' ms' : 'OFF'}\n` +
      `fps est : ${fps}`;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
