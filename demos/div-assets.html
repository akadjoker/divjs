<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS DIV Assets Demo (FPG + FNT)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d141e;
      color: #d9e7f5;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 16px;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 14px;
    }
    .panel {
      background: #101b28;
      border: 1px solid #22344b;
      border-radius: 8px;
      padding: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font: 700 18px "Fira Sans", "Segoe UI", sans-serif;
    }
    p {
      margin: 0 0 8px;
      color: #a8bdd3;
      line-height: 1.4;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 9px 10px;
      border: 1px solid #2e4a65;
      border-radius: 6px;
      background: #18304a;
      color: #dff0ff;
      font: 600 13px "Fira Sans", "Segoe UI", sans-serif;
      cursor: pointer;
    }
    button:hover { background: #214264; }
    canvas {
      width: 100%;
      max-width: 920px;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #2c4562;
      background: #0a1220;
      border-radius: 8px;
      display: block;
    }
    .status {
      margin-top: 8px;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      color: #8fe39a;
      white-space: pre-wrap;
      min-height: 32px;
    }
    .warn { color: #ffb069; }
    .err { color: #ff7a7a; }
    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>DIV Assets Demo</h1>
      <p>Mostra sprites de <strong>tutor0.fpg</strong> e texto com <strong>tutor1.fnt</strong>.</p>
      <p>Ficheiros usados:</p>
      <p>assets/div-support/tutor0.fpg<br>assets/div-support/tutor1.fnt</p>
      <button id="btnReload">Reload</button>
      <div id="status" class="status">ready</div>
    </section>

    <section class="panel">
      <canvas id="c" width="920" height="640"></canvas>
    </section>
  </div>

  <script type="module">
    import { loadDivFpgFromUrl, loadDivFntFromUrl, renderDivFontText } from '../vm/div_formats.js';

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const btnReload = document.getElementById('btnReload');

    function setStatus(text, cls = '') {
      statusEl.className = `status ${cls}`.trim();
      statusEl.textContent = text;
    }

    function clear() {
      ctx.fillStyle = '#0a1220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGridFpg(fpg, ox, oy, maxCols = 10) {
      const sorted = [...fpg.maps].sort((a, b) => a.code - b.code);
      const cellW = 84;
      const cellH = 84;

      ctx.font = '11px JetBrains Mono, Consolas, monospace';
      ctx.textBaseline = 'top';

      sorted.forEach((map, idx) => {
        const col = idx % maxCols;
        const row = Math.floor(idx / maxCols);
        const x = ox + col * cellW;
        const y = oy + row * cellH;

        ctx.strokeStyle = '#1f334a';
        ctx.strokeRect(x, y, 76, 76);

        const drawW = Math.min(64, map.width);
        const drawH = Math.min(64, map.height);
        ctx.drawImage(map.canvas, x + 6, y + 6, drawW, drawH);

        ctx.fillStyle = '#b4ccdf';
        ctx.fillText(String(map.code), x + 4, y + 64);
      });

      return Math.ceil(sorted.length / maxCols) * cellH;
    }

    async function runDemo() {
      clear();
      setStatus('loading tutor0.fpg + tutor1.fnt ...');

      try {
        const [fpg, fnt] = await Promise.all([
          loadDivFpgFromUrl('../assets/div-support/tutor0.fpg'),
          loadDivFntFromUrl('../assets/div-support/tutor1.fnt')
        ]);

        clear();

        ctx.fillStyle = '#d9e7f5';
        ctx.font = '13px JetBrains Mono, Consolas, monospace';
        ctx.textBaseline = 'top';
        ctx.fillText(`FPG magic=${fpg.magic} bpp=${fpg.bpp} maps=${fpg.maps.length}`, 12, 10);
        ctx.fillText(`FNT magic=${fnt.magic} bpp=${fnt.bpp}`, 12, 28);

        const gridHeight = drawGridFpg(fpg, 12, 52, 10);
        const textY = 52 + gridHeight + 12;

        ctx.fillStyle = '#8aa8c5';
        ctx.fillText('Texto usando tutor1.fnt:', 12, textY);

        renderDivFontText(ctx, fnt, 12, textY + 18, 'DIV FNT DEMO 0123456789');
        renderDivFontText(ctx, fnt, 12, textY + 42, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ');
        renderDivFontText(ctx, fnt, 12, textY + 66, 'abcdefghijklmnopqrstuvwxyz');

        setStatus(`ok\nFPG: ${fpg.maps.length} mapas\nFNT: ${fnt.glyphs.filter(Boolean).length} glyphs`);
      } catch (error) {
        clear();
        ctx.fillStyle = '#ff7a7a';
        ctx.font = '14px JetBrains Mono, Consolas, monospace';
        ctx.fillText('Erro a carregar assets DIV', 12, 12);
        ctx.fillText(String(error?.message || error), 12, 32);
        setStatus(`erro: ${error?.message || String(error)}`, 'err');
      }
    }

    btnReload.addEventListener('click', runDemo);
    runDemo();
  </script>
</body>
</html>
