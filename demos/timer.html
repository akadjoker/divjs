<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS - Timer Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a111a;
      color: #d7e6f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 12px;
    }
    canvas {
      display: block;
      border: 1px solid #2b4158;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0e1a29;
    }
    p {
      color: #93aecd;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      text-align: center;
      max-width: 820px;
      line-height: 1.4;
    }
    #log {
      width: 860px;
      max-width: 100%;
      background: #0f1b2a;
      border: 1px solid #2a3f55;
      padding: 8px;
      min-height: 40px;
      color: #9bc8f2;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="c" width="860" height="520"></canvas>
  <p>
    Demo do sistema de timers: timer[0] a timer[9], get_delta(),
    get_time(), e uso de timers para animações e delays.
  </p>
  <div id="log">booting...</div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const SOURCE = `PROGRAM timer_demo;

GLOBAL g_elapsed_ms = 0;
GLOBAL g_delta_sec = 0;
GLOBAL g_frame_count = 0;
GLOBAL g_fps = 0;
GLOBAL g_anim_timer = 0;

// Process that tracks elapsed time
PROCESS time_tracker();
private
  last_ms = 0;
  fps_timer = 0;
  fps_count = 0;
BEGIN
  x = 20;
  y = 20;
  last_ms = get_time();

  LOOP
    g_elapsed_ms = get_time();
    g_delta_sec = get_delta();
    g_frame_count = g_frame_count + 1;

    // Update FPS display every second
    fps_count = fps_count + 1;
    IF (timer[0] > 1000)
      g_fps = fps_count * 1000 / timer[0];
      timer[0] = 0;
      fps_count = 0;
    END

    FRAME;
  END
END

// Animated ball using timer-based animation
PROCESS animated_ball(px, py, radius, delay);
private
  state = 0;
  last_switch = 0;
BEGIN
  x = px;
  y = py;
  width = radius * 2;
  height = radius * 2;
  state = 0;
  last_switch = timer[1];

  LOOP
    // Switch states based on timer delay
    IF (timer[1] - last_switch >= delay)
      state = state + 1;
      IF (state > 2)
        state = 0;
      END
      last_switch = timer[1];
    END

    // Draw based on state
    SWITCH (state);
      CASE 0:
        set_color('#ff6b6b');
      END
      CASE 1:
        set_color('#4ecdc4');
      END
      CASE 2:
        set_color('#95e1d3');
      END
    END
    circle(x, y, radius);

    FRAME;
  END
END

// Pulsing circle using sine wave and timer
PROCESS pulsing_circle(px, py, base_radius);
private
  current_radius = 0;
  phase = 0;
BEGIN
  x = px;
  y = py;

  LOOP
    phase = phase + 0.1;
    current_radius = base_radius + sin(phase) * 10;

    set_color('#f38181');
    circle(x, y, current_radius);

    set_color('#ffffff');
    text(x - 30, y - current_radius - 15, "Pulsing!");

    FRAME;
  END
END

// Countdown timer demonstration
PROCESS countdown_timer(px, py, start_seconds);
private
  remaining = 0;
  last_tick = 0;
  tick_interval = 0;
BEGIN
  x = px;
  y = py;
  remaining = start_seconds;
  tick_interval = 1000; // 1 second
  last_tick = timer[2];

  LOOP
    IF (timer[2] - last_tick >= tick_interval)
      remaining = remaining - 1;
      last_tick = timer[2];
    END

    IF (remaining <= 0)
      remaining = 0;
      // Blink when done
      IF (get_time() % 500 < 250)
        set_color('#ff6b6b');
      ELSE
        set_color('#ffffff');
      END
    ELSE
      set_color('#4ecdc4');
    END

    text(x - 20, y, "Countdown: " + remaining);

    FRAME;
  END
END

// Show all available timers
PROCESS timer_display();
BEGIN
  x = 20;
  y = 400;

  LOOP
    set_color('#93aecd');
    text(x, y, "Timer array (ms):");

    text(x + 20, y + 15, "timer[0] = " + timer[0]);
    text(x + 120, y + 15, "timer[1] = " + timer[1]);
    text(x + 220, y + 15, "timer[2] = " + timer[2]);
    text(x + 320, y + 15, "timer[3] = " + timer[3]);
    text(x + 420, y + 15, "timer[4] = " + timer[4]);
    text(x + 520, y + 15, "timer[5] = " + timer[5]);

    set_color('#d7e6f5');
    text(x, y + 35, "get_time() = " + get_time() + " ms");
    text(x, y + 50, "get_delta() = " + get_delta() + " sec");
    text(x, y + 65, "get_fps() = " + get_fps());
    text(x, y + 80, "frames = " + g_frame_count);

    FRAME;
  END
END

BEGIN
  set_mode(860, 520);
  screen_color('#0e1a29');

  time_tracker();

  // Spawn animated balls with different delays
  animated_ball(200, 200, 30, 500);   // Changes every 0.5s
  animated_ball(350, 200, 30, 1000);  // Changes every 1s
  animated_ball(500, 200, 30, 2000);  // Changes every 2s

  pulsing_circle(660, 200, 25);

  countdown_timer(430, 350, 10);

  timer_display();

  set_color('#ffffff');
  text(10, 10, "Timer System Demo");
  text(10, 25, "Each timer[] tracks elapsed milliseconds");

  LOOP FRAME; END
END`;

    const log = document.getElementById('log');

    await runDivDemo({
      canvas: document.getElementById('c'),
      source: SOURCE,
      logFn: (line) => {
        log.textContent = line;
      }
    });
  </script>
</body>
</html>
