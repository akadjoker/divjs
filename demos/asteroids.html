<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DivJS — Asteroids</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050810;
      color: #8ab4d8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 12px;
    }
    canvas {
      display: block;
      border: 1px solid #152535;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #03060c;
    }
    p {
      color: #5a7a98;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      text-align: center;
      max-width: 640px;
      line-height: 1.4;
    }
    #log {
      width: 640px;
      max-width: 100%;
      background: #0a1018;
      border: 1px solid #1c2c40;
      padding: 6px;
      min-height: 28px;
      color: #7ab0e0;
      font: 11px "JetBrains Mono", "Consolas", monospace;
      white-space: pre-wrap;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="480"></canvas>
  <p>
    ← → rodar · ↑ acelerar · ESPAÇO disparar · H hiperspaço · R reiniciar.
    Destrói todos os asteroides!
  </p>
  <div id="log">booting...</div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const SOURCE = `PROGRAM asteroids;

GLOBAL
  g_player_type  = 0;
  g_bullet_type  = 0;
  g_roid_big     = 0;
  g_roid_med     = 0;
  g_roid_sml     = 0;

  g_ship_gfx   = 0;
  g_bullet_gfx = 0;
  g_roid1_gfx  = 0;
  g_roid2_gfx  = 0;
  g_roid3_gfx  = 0;
  g_boom_gfx   = 0;
  g_star_gfx   = 0;

  g_gfx_init = 0;

  g_score  = 0;
  g_lives  = 3;
  g_over   = 0;
  g_wave   = 1;
  g_roids_left = 0;

PROCESS init_graphics();
BEGIN
  // Player ship (20x20) — triangle pointing RIGHT at angle=0 (DIV convention).
  // Drawn symmetrically around the 10,10 center so rotation feels centered.
  // The ship starts facing UP by setting dir=90000 in the player process.
  g_ship_gfx = new_graphic(20, 20);
  gfx_fill_rgba(g_ship_gfx, 0, 0, 0, 0);
  gfx_line(g_ship_gfx, 18, 10, 2, 4, 120, 220, 255);
  gfx_line(g_ship_gfx, 18, 10, 2, 16, 120, 220, 255);
  gfx_line(g_ship_gfx, 6, 7, 6, 13, 100, 200, 240);
  gfx_rect(g_ship_gfx, 2, 9, 2, 2, 255, 160, 60);
  gfx_pixel(g_ship_gfx, 11, 10, 200, 255, 255);

  // Bullet (4x4)
  g_bullet_gfx = new_graphic(4, 4);
  gfx_fill_rgba(g_bullet_gfx, 0, 0, 0, 0);
  gfx_rect(g_bullet_gfx, 0, 0, 4, 4, 255, 255, 120);

  // Big asteroid (40x40) — jagged rock
  g_roid1_gfx = new_graphic(40, 40);
  gfx_fill_rgba(g_roid1_gfx, 0, 0, 0, 0);
  gfx_line(g_roid1_gfx, 20, 2, 36, 10, 180, 150, 100);
  gfx_line(g_roid1_gfx, 36, 10, 38, 24, 180, 150, 100);
  gfx_line(g_roid1_gfx, 38, 24, 30, 36, 180, 150, 100);
  gfx_line(g_roid1_gfx, 30, 36, 14, 38, 180, 150, 100);
  gfx_line(g_roid1_gfx, 14, 38, 2, 26, 180, 150, 100);
  gfx_line(g_roid1_gfx, 2, 26, 4, 12, 180, 150, 100);
  gfx_line(g_roid1_gfx, 4, 12, 20, 2, 180, 150, 100);
  gfx_pixel(g_roid1_gfx, 14, 14, 120, 100, 60);
  gfx_pixel(g_roid1_gfx, 24, 20, 120, 100, 60);
  gfx_pixel(g_roid1_gfx, 18, 26, 120, 100, 60);

  // Medium asteroid (24x24)
  g_roid2_gfx = new_graphic(24, 24);
  gfx_fill_rgba(g_roid2_gfx, 0, 0, 0, 0);
  gfx_line(g_roid2_gfx, 12, 1, 22, 6, 190, 160, 110);
  gfx_line(g_roid2_gfx, 22, 6, 23, 16, 190, 160, 110);
  gfx_line(g_roid2_gfx, 23, 16, 16, 22, 190, 160, 110);
  gfx_line(g_roid2_gfx, 16, 22, 4, 21, 190, 160, 110);
  gfx_line(g_roid2_gfx, 4, 21, 1, 10, 190, 160, 110);
  gfx_line(g_roid2_gfx, 1, 10, 12, 1, 190, 160, 110);
  gfx_pixel(g_roid2_gfx, 8, 8, 130, 110, 70);
  gfx_pixel(g_roid2_gfx, 16, 14, 130, 110, 70);

  // Small asteroid (14x14)
  g_roid3_gfx = new_graphic(14, 14);
  gfx_fill_rgba(g_roid3_gfx, 0, 0, 0, 0);
  gfx_line(g_roid3_gfx, 7, 1, 13, 5, 200, 170, 120);
  gfx_line(g_roid3_gfx, 13, 5, 12, 11, 200, 170, 120);
  gfx_line(g_roid3_gfx, 12, 11, 4, 13, 200, 170, 120);
  gfx_line(g_roid3_gfx, 4, 13, 1, 6, 200, 170, 120);
  gfx_line(g_roid3_gfx, 1, 6, 7, 1, 200, 170, 120);
  gfx_pixel(g_roid3_gfx, 5, 6, 140, 120, 80);

  // Explosion (28x28)
  g_boom_gfx = new_graphic(28, 28);
  gfx_fill_rgba(g_boom_gfx, 0, 0, 0, 0);
  gfx_circle(g_boom_gfx, 14, 14, 12, 255, 200, 80);
  gfx_circle(g_boom_gfx, 14, 14, 8, 255, 140, 40);
  gfx_circle(g_boom_gfx, 14, 14, 4, 255, 240, 200);

  // Star (1x1)
  g_star_gfx = new_graphic(1, 1);
  gfx_pixel(g_star_gfx, 0, 0, 80, 100, 140);

  g_gfx_init = 1;
END

// ---- Background stars ----
PROCESS star(sx, sy, br);
BEGIN
  x = sx; y = sy;
  width = 1; height = 1;
  ctype = c_screen;
  graph = g_star_gfx;
  alpha = br;
  LOOP FRAME; END
END

PROCESS star_field();
PRIVATE i = 0;
BEGIN
  i = 0;
  WHILE (i < 80)
    star(rand(640), rand(480), rand(60) + 20);
    i = i + 1;
  END
END

// ---- Explosion ----
PROCESS boom(ex, ey);
PRIVATE life = 12;
BEGIN
  x = ex; y = ey;
  width = 28; height = 28;
  ctype = c_screen;
  graph = g_boom_gfx;
  LOOP
    life = life - 1;
    alpha = life * 8;
    IF (life <= 0) BREAK; END
    FRAME;
  END
END

// ---- Player bullet ----
PROCESS bullet(bx, by, bang);
PRIVATE life = 60;
BEGIN
  x = bx; y = by;
  width = 4; height = 4;
  ctype = c_screen;
  graph = g_bullet_gfx;
  LOOP
    x = x + get_distx(bang, 12);
    y = y + get_disty(bang, 12);
    // Wrap
    IF (x < 0) x = x + 640; END
    IF (x > 640) x = x - 640; END
    IF (y < 0) y = y + 480; END
    IF (y > 480) y = y - 480; END

    life = life - 1;
    IF (life <= 0) BREAK; END

    IF (collision(g_roid_big))
      g_roids_left = g_roids_left - 1;
      BREAK;
    END
    IF (collision(g_roid_med))
      g_roids_left = g_roids_left - 1;
      BREAK;
    END
    IF (collision(g_roid_sml))
      g_roids_left = g_roids_left - 1;
      BREAK;
    END
    FRAME;
  END
END

// ---- Asteroid ----
PROCESS asteroid(sx, sy, sz, sang, sspd);
PRIVATE
  vx = 0;
  vy = 0;
  spin = 0;
BEGIN
  x = sx; y = sy;
  ctype = c_screen;

  IF (sz == 3)
    width = 40; height = 40;
    graph = g_roid1_gfx;
  ELSE
    IF (sz == 2)
      width = 24; height = 24;
      graph = g_roid2_gfx;
    ELSE
      width = 14; height = 14;
      graph = g_roid3_gfx;
    END
  END

  vx = get_distx(sang, sspd);
  vy = get_disty(sang, sspd);
  spin = rand(5000) - 2500;

  LOOP
    IF (g_over) BREAK; END

    x = x + vx;
    y = y + vy;
    angle = angle + spin;

    // Wrap around screen
    IF (x < -20) x = x + 660; END
    IF (x > 660) x = x - 660; END
    IF (y < -20) y = y + 500; END
    IF (y > 500) y = y - 500; END

    // Collision with player
    IF (collision(g_player_type))
      boom(x, y);
      g_lives = g_lives - 1;
      BREAK;
    END

    // Collision with bullet = split
    IF (collision(g_bullet_type))
      boom(x, y);
      IF (sz == 3)
        g_score = g_score + 20;
        asteroid(x, y, 2, rand(360000), 2);
        asteroid(x, y, 2, rand(360000), 2);
      ELSE
        IF (sz == 2)
          g_score = g_score + 50;
          asteroid(x, y, 1, rand(360000), 3);
          asteroid(x, y, 1, rand(360000), 3);
        ELSE
          g_score = g_score + 100;
        END
      END
      BREAK;
    END

    FRAME;
  END
END

// ---- Wave spawner ----
PROCESS wave_manager();
PRIVATE n = 0; i = 0;
BEGIN
  LOOP
    // Wait for all asteroids to be cleared
    IF (g_roids_left <= 0 AND g_over == 0)
      g_wave = g_wave + 1;
      n = g_wave + 3;
      IF (n > 8) n = 8; END
      g_roids_left = n;
      i = 0;
      WHILE (i < n)
        asteroid(rand(600) + 20, rand(440) + 20, 3, rand(360000), 1);
        i = i + 1;
      END
    END
    FRAME;
  END
END

// ---- Player ship ----
PROCESS player();
PRIVATE
  dir = 90000;  // start facing UP (DIV: 0=right, CCW positive, so 90000 = up)
  vx = 0;
  vy = 0;
  cooldown = 0;
  inv = 0;
  flash = 0;
BEGIN
  x = 320; y = 240;
  width = 20; height = 20;
  ctype = c_screen;
  graph = g_ship_gfx;

  LOOP
    IF (g_over) BREAK; END

    // Rotation — dir is DIV angle (0=right, CCW positive)
    IF (key(_left))
      dir = dir + 7000;
    END
    IF (key(_right))
      dir = dir - 7000;
    END

    // Sprite angle follows dir (runtime already speaks DIV angles)
    angle = dir;

    // Thrust along dir
    IF (key(_up))
      vx = vx + get_distx(dir, 3) / 10;
      vy = vy + get_disty(dir, 3) / 10;
    END

    // Friction
    vx = vx * 98 / 100;
    vy = vy * 98 / 100;

    // Speed cap
    IF (vx > 8)  vx = 8;  END
    IF (vx < -8) vx = -8; END
    IF (vy > 8)  vy = 8;  END
    IF (vy < -8) vy = -8; END

    // Apply velocity
    x = x + vx;
    y = y + vy;

    // Wrap
    IF (x < -10) x = x + 650; END
    IF (x > 650) x = x - 650; END
    IF (y < -10) y = y + 490; END
    IF (y > 490) y = y - 490; END

    // Shooting — bullet spawns just ahead of the ship nose
    cooldown = cooldown - 1;
    IF (key(_space) AND cooldown <= 0)
      bullet(x + get_distx(dir, 12), y + get_disty(dir, 12), dir);
      cooldown = 12;
    END

    // Hyperspace (random teleport)
    IF (key(_h))
      x = rand(600) + 20;
      y = rand(440) + 20;
      vx = 0; vy = 0;
    END

    // Invincibility flashing
    inv = inv - 1;
    IF (inv < 0) inv = 0; END
    IF (inv > 0)
      flash = flash + 1;
      IF (flash > 3)
        alpha = 100;
        flash = 0;
      ELSE
        alpha = 30;
      END
    ELSE
      alpha = 100;
    END

    FRAME;
  END
END

// ---- Game manager ----
PROCESS game_manager();
BEGIN
  ctype = c_screen;
  player();
  wave_manager();
  g_wave = 0;

  LOOP
    IF (g_lives <= 0)
      g_over = 1;
      WHILE (NOT (key(_r) OR key(_enter))) FRAME; END
      g_score = 0;
      g_lives = 3;
      g_over = 0;
      g_roids_left = 0;
      g_wave = 0;
      player();
    END
    FRAME;
  END
END

// ---- HUD ----
PROCESS hud();
BEGIN
  ctype = c_screen;
  LOOP
    set_color('#7ce0ff');
    text(12, 8, "SCORE " + g_score);
    set_color('#ff6b6b');
    text(540, 8, "LIVES " + g_lives);
    set_color('#7ab0e0');
    text(290, 8, "WAVE " + g_wave);

    IF (g_over)
      set_color('#ffe070');
      text(260, 220, "*** GAME OVER ***");
      set_color('#7ce0ff');
      text(230, 240, "Press R or ENTER");
    END
    FRAME;
  END
END

BEGIN
  set_mode(640, 480);
  screen_color('#03060c');

  init_graphics();
  WHILE (g_gfx_init == 0) FRAME; END

  g_player_type = TYPE player;
  g_bullet_type = TYPE bullet;
  g_roid_big    = TYPE asteroid;
  g_roid_med    = TYPE asteroid;
  g_roid_sml    = TYPE asteroid;

  star_field();
  game_manager();
  hud();

  LOOP FRAME; END
END`;

    const log = document.getElementById('log');

    await runDivDemo({
      canvas: document.getElementById('c'),
      source: SOURCE,
      logFn: (line) => {
        log.textContent = line;
      }
    });
  </script>
</body>
</html>
