<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS - Tutorial 3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2em;
    }

    canvas {
      border: 4px solid #4a9eff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
      /* Native DIV resolution is 320x200; scale up for a modern display
         while keeping the script's coordinates 1:1 with the original. */
      width: 960px;
      height: 600px;
      image-rendering: pixelated;
    }

    .info {
      color: #aaa;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 DivJS Tutorial 3</h1>
    <canvas id="gameCanvas" width="320" height="200"></canvas>
    <div id="log">booting...</div>
  </div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const source = `
PROGRAM Tutorial_3;

GLOBAL
    raquet1,raquet2; // Raquets' identifiers

BEGIN
    // Loads file with game's graphic
    load_fpg('../assets/div-support/tutor3.fpg');

    put_screen(0,1);    // Puts background screen
    fade_on();          // Fades screen on
    // Creates both raquets and takes its' identifiers
    raquet1=raquet(6,24,_q,_a);
    raquet2=raquet(314,24,_p,_l);
    // Creates ball type process
    ball(160,100,1,1);
END

//---------------------------------------------------------------------------
// Process ball
// Handles game ball
// Entries: x,y   = Graphic's coordinate
//          ix,iy = Increments on each one of the coordinates
//---------------------------------------------------------------------------

PROCESS ball(x,y,ix,iy);

BEGIN
    graph=3;    // Selects graphic
    REPEAT
        FRAME(25);  // Shows it on screen more times than the rest of graphics
        // Checks if bounces with top and bottom edges
        IF (y==14 or y==186)
            iy=-iy; // Changes vertical direction
        END
        // Checks if bounces with raquets
        IF ((x==10 and abs(y-raquet1.y)<22) or
           (x==310 and abs(y-raquet2.y)<22))
            ix=-ix; // Changes horizontal direction
        END
        // Moves ball
        x=x+ix;
        y=y+iy;
    UNTIL (out_region(id,0))    // Repeats until it gets out of screen
    ball(160,100,ix,iy);        // Creates a new ball
END

//---------------------------------------------------------------------------
// Process raquet
// Handles players' raquets
// Entries: x,y    = Graphics' coordinates
//          up     = Key to move upwards
//          down   = Key to move downwards
//---------------------------------------------------------------------------

PROCESS raquet(x,y,up,down)

BEGIN
    graph=2;        // Selects graphic
    LOOP
        FRAME;      // Shows it
        // If up key is pressed and the limit has not been reached
        IF (key(up) and y>24)
            y=y-4;  // Moves raquet
        END
        // If down key is pressed and the limit has not been reached
        IF (key(down) and y<176)
            y=y+4; // Moves raquet
        END
    END
END

`;

    const canvas = document.getElementById('gameCanvas');
    const log = document.getElementById('log');

    let statusLine = '';
    function logLine(line) {
      console.log(line);
      log.textContent = statusLine ? `${line}  ||  ${statusLine}` : line;
    }

    try {
      runDivDemo({
        canvas,
        source: source,
        clearColor: '#000',
        onLog: (line) => { logLine(line); },
        onFrame: ({ runtime }) => {
          const fps = Math.round(runtime.fpsValue || 0);
          const procs = runtime.vm?.processManager?.getAll?.() || [];
          const active = procs.filter(p => p.active && !p.suspended && !p.dead);

        },
        onError: (err) => {
          logLine('error: ' + (err?.message || String(err)));
          console.error(err);
        }
      });
    } catch (err) {
      logLine('error: ' + (err?.message || String(err)));
      console.error(err);
    }
  </script>
</body>

</html>
