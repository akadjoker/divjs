<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS API Tutorial 11 - Process Communication</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a111a;
      color: #d7e6f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 12px;
    }
    canvas {
      display: block;
      border: 1px solid #2b4158;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0e1a29;
    }
    p {
      color: #93aecd;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      text-align: center;
      max-width: 640px;
      line-height: 1.5;
    }
    #log {
      width: 640px;
      max-width: 100%;
      background: #0f1b2a;
      border: 1px solid #2a3f55;
      padding: 8px;
      min-height: 40px;
      color: #9bc8f2;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="480"></canvas>
  <p>
    Tutorial 11: comunicação entre processos usando <code>signal()</code>, <code>get_id()</code>,
    <code>collision()</code> e <code>TYPE</code>.<br>
    APIs: <code>signal()</code>, <code>collision()</code>, <code>TYPE</code>, <code>get_id()</code>.
  </p>
  <div id="log">booting...</div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const SOURCE = `PROGRAM tutor_api_11;

GLOBAL g_lib = 0;
GLOBAL g_minion_count = 0;
GLOBAL g_signal_count = 0;

PROCESS spawner();
PRIVATE
  spawn_timer = 0;
BEGIN
  x = 320; y = 100;
  width = 40; height = 40;
  file = g_lib;
  graph = 100;
  size = 150;

  LOOP
    // Spawn minion periodicamente
    spawn_timer = spawn_timer + 1;
    IF (spawn_timer >= 60)
      spawn_timer = 0;
      IF (g_minion_count < 8)
        signal(TYPE minion, s_kill);  // Mata minions existentes
        g_minion_count = 0;
      END
    END
    FRAME;
  END
END

PROCESS minion();
PRIVATE
  speed = 0;
  alive = 0;
  collector = 0;
BEGIN
  x = rand(100, 540);
  y = rand(200, 400);
  width = 16; height = 16;
  file = g_lib;
  graph = 103;
  speed = rand(1, 3);
  alive = 1;
  g_minion_count = g_minion_count + 1;

  LOOP
    IF (alive = 1)
      // Move
      x = x + speed;
      IF (x > 630)
        x = 10;
        y = rand(200, 400);
      END

      // Verifica coleta pelo player
      collector = collision(TYPE player);
      IF (collector <> 0)
        signal(get_id(), s_kill);
        g_minion_count = g_minion_count - 1;
        g_signal_count = g_signal_count + 1;
        alive = 0;
      END

      FRAME;
    ELSE
      // Desaparece gradualmente
      size = size - 5;
      IF (size <= 0)
        signal(get_id(), s_kill);
      END
      FRAME;
    END
  END
END

PROCESS player();
BEGIN
  x = 320; y = 440;
  width = 32; height = 32;
  file = g_lib;
  graph = 100;

  LOOP
    IF (key(_left))  x = x - 4; END
    IF (key(_right)) x = x + 4; END

    IF (x < 16)  x = 16;  END
    IF (x > 624) x = 624; END

    FRAME;
  END
END

PROCESS score_display();
BEGIN
  LOOP
    set_color('#9bc8f2');
    text(12, 8, "Tutorial 11 - signal / collision / spawn");
    
    set_color('#93aecd');
    text(12, 440, "minions: " + g_minion_count);
    text(12, 455, "collected: " + g_signal_count);

    FRAME;
  END
END

BEGIN
  set_mode(640, 480);
  screen_color('#0e1a29');

  g_lib = load_fpg('../assets/div-support/help.fpg');
  put_screen(g_lib, 1);

  spawner();
  player();
  score_display();

  LOOP FRAME; END
END`;

    const log = document.getElementById('log');
    runDivDemo({
      canvas: document.getElementById('c'),
      source: SOURCE,
      clearColor: '#0e1a29',
      onLog: (line) => { log.textContent = line; },
      onError: (err) => { log.textContent = 'error: ' + (err?.message || String(err)); }
    });
  </script>
</body>
</html>
