<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS API Tutorial 02 - Angles & advance()</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a111a;
      color: #d7e6f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 12px;
    }
    canvas {
      display: block;
      border: 1px solid #2b4158;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0e1a29;
    }
    p {
      color: #93aecd;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      text-align: center;
      max-width: 640px;
      line-height: 1.5;
    }
    #log {
      width: 640px;
      max-width: 100%;
      background: #0f1b2a;
      border: 1px solid #2a3f55;
      padding: 8px;
      min-height: 40px;
      color: #9bc8f2;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="480"></canvas>
  <p>
    Tutorial 02: roda a flecha (graph 101) com as setas e avança na direção do ângulo.<br>
    APIs: <code>angle</code>, <code>advance()</code>, <code>fget_angle()</code>,
    <code>get_distx()</code>, <code>get_disty()</code>.
  </p>
  <div id="log">booting...</div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const SOURCE = `PROGRAM tutor_api_02;

GLOBAL g_lib = 0;
GLOBAL g_angle = 0;

PROCESS arrow();
BEGIN
  x = 320; y = 240;
  width = 32; height = 32;
  file = g_lib;
  graph = 101;       // Flecha 32x32 do help.fpg
  angle = 0;

  LOOP
    IF (key(_left))  angle = angle + 5000; END
    IF (key(_right)) angle = angle - 5000; END

    IF (angle > 360000) angle = angle - 360000; END
    IF (angle < 0)      angle = angle + 360000; END

    g_angle = angle;

    IF (key(_up))
      advance(3);    // move na direção de angle
    END

    IF (x < 16)  x = 16;  END
    IF (x > 624) x = 624; END
    IF (y < 16)  y = 16;  END
    IF (y > 464) y = 464; END

    FRAME;
  END
END

BEGIN
  set_mode(640, 480);
  screen_color('#0e1a29');

  g_lib = load_fpg('../assets/div-support/help.fpg');
  put_screen(g_lib, 3);   // Fondo circular

  arrow();

  LOOP
    set_color('#9bc8f2');
    text(12, 8, "Tutorial 02 - angle / advance");
    text(12, 22, "angle=" + g_angle / 1000 + " deg");
    FRAME;
  END
END`;

    const log = document.getElementById('log');
    runDivDemo({
      canvas: document.getElementById('c'),
      source: SOURCE,
      clearColor: '#0e1a29',
      onLog: (line) => { log.textContent = line; },
      onError: (err) => { log.textContent = 'error: ' + (err?.message || String(err)); }
    });
  </script>
</body>
</html>
