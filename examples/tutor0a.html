<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS -Tutorial 0</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2em;
    }

    canvas {
      border: 4px solid #4a9eff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
    }

    .info {
      color: #aaa;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 DivJS Tutorial 0</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="log">booting...</div>
  </div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const source = `
    
PROGRAM Tutorial_0;
BEGIN
    load_fpg('../assets/div-support/tutor0.fpg');
    put_screen(0,2);  // Sets graphic number 2 as screen background
    ship();           // Creates a "ship" type process
END


//-----------------------------------------------------------------------
// Handles player's ship
//-----------------------------------------------------------------------

PROCESS ship()
BEGIN
    graph=1; x=160; y=500;    // Selects graphic and coordinates
    size=200;
    
    LOOP                      // Enters an infinite loop
        x=mouse.x;            // Puts ship on x mouse's coordinate
        IF (mouse.left)       // When left mouse button is pressed
            shot(x,y-20);  // creates a "shot" type process
        END
        FRAME;                // Shows next image of ship
    END
END

//-----------------------------------------------------------------------
// Handles ship's shots
// Entries: Graphic's coordinates 
//-----------------------------------------------------------------------

PROCESS shot(x,y)
BEGIN
    graph=3;    // Selects graphic
    size=200;
    REPEAT      // Repeated loop
        y-=16;  // Moves upwards 16 points
        FRAME;  // Shows next image
    UNTIL (y<0) // Repeats until it gets out of top screen
END

`;

    const canvas = document.getElementById('gameCanvas');
    const log = document.getElementById('log');

    let statusLine = '';
    function logLine(line) {
      console.log(line);
      log.textContent = statusLine ? `${line}  ||  ${statusLine}` : line;
    }

    try {
      runDivDemo({
        canvas,
        source: source,
        clearColor: '#000',
        onLog: (line) => { logLine(line); },
        onFrame: ({ runtime }) => {
          const fps = Math.round(runtime.fpsValue || 0);
          const procs = runtime.vm?.processManager?.getAll?.() || [];
          const active = procs.filter(p => p.active && !p.suspended && !p.dead);
          
        },
        onError: (err) => {
          logLine('error: ' + (err?.message || String(err)));
          console.error(err);
        }
      });
    } catch (err) {
      logLine('error: ' + (err?.message || String(err)));
      console.error(err);
    }
  </script>
</body>

</html>
