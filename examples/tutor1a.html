<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS -Tutorial 0</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2em;
    }

    canvas {
      border: 4px solid #4a9eff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
    }

    .info {
      color: #aaa;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 DivJS Tutorial 0</h1>
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div id="log">booting...</div>
  </div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const source = `
    
PROGRAM Tutorial_1;
BEGIN
    load_fpg('../assets/div-support/tutor1.fpg');
    put_screen(0,63);   // Puts background screen
    ship(320,240,41);   // Creates ship process
    // Creates with a loop 4 big asteroids
    FROM x=1 TO 8; asteroid(); END
END

//-------------------------------------------------------------------
// Process ship
// Handles player's ship
// Entries: Coordinates and graphic's code number
//-------------------------------------------------------------------

PROCESS ship(x,y,graph)
BEGIN
    LOOP
        // Checks if left or right keys are pressed
        // And modifies angle if they are so
        IF (key(_left)) angle=angle+10000; END
        IF (key(_right)) angle=angle-10000; END
        // If up key is pressed, moves ship upwards
        IF (key(_up)) advance(8); END
        FRAME;  // Shows ship's graphic on screen
    END
END

//-------------------------------------------------------------------
// Process asteroid
// Handles all game asteroids, big and small ones
//-------------------------------------------------------------------

PROCESS asteroid()
BEGIN
    LOOP
        // Creates an asteroid on top left corner
        // (Coordinates: 0,0) and asigns a code number to the graphic
        x=0; y=0; graph=1;
        // Chooses an angle randomly
        angle=rand(-180000,180000);
        // Repeats while it is on screen
        WHILE (x>=0 AND x<=640 AND
               y>=0 AND y<=480)
            // Animates graphic, adding one to it's code number
            graph=graph+1;
            // If animation's limit is overpassed, reinitializes it
            IF (graph==21) graph=1; END
            // Makes graphic to advance into a certain direction
            advance(4);
            FRAME;      // Prints graphic on screen
        END
    END
END




`;

    const canvas = document.getElementById('gameCanvas');
    const log = document.getElementById('log');

    let statusLine = '';
    function logLine(line) {
      console.log(line);
      log.textContent = statusLine ? `${line}  ||  ${statusLine}` : line;
    }

    try {
      runDivDemo({
        canvas,
        source: source,
        clearColor: '#000',
        onLog: (line) => { logLine(line); },
        onFrame: ({ runtime }) => {
          const fps = Math.round(runtime.fpsValue || 0);
          const procs = runtime.vm?.processManager?.getAll?.() || [];
          const active = procs.filter(p => p.active && !p.suspended && !p.dead);
          
        },
        onError: (err) => {
          logLine('error: ' + (err?.message || String(err)));
          console.error(err);
        }
      });
    } catch (err) {
      logLine('error: ' + (err?.message || String(err)));
      console.error(err);
    }
  </script>
</body>

</html>
