<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS - Platformer Example</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container { text-align: center; }
    h1 { color: #fff; margin-bottom: 20px; font-size: 2em; }
    canvas {
      border: 4px solid #4a9eff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
    }
    .info { color: #aaa; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 DivJS Platformer</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info">Arrow Keys to move | SPACE to jump</div>
  </div>
  
  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const source = `program platformer;

global speed = 220;
global gravity = 700;
global jump_force = 330;

process player(x, y);
private
  vy = 0;
  on_ground = 0;
begin
  width = 30;
  height = 42;

  loop
    if (key(_left))
      x = x - speed * get_delta();
    end

    if (key(_right))
      x = x + speed * get_delta();
    end

    vy = vy + gravity * get_delta();

    if (key(_space) and on_ground)
      vy = -jump_force;
      on_ground = 0;
    end

    y = y + vy * get_delta();

    if (y > 540)
      y = 540;
      vy = 0;
      on_ground = 1;
    end

    set_color('#4a9eff');
    draw_rect(x, y, width, height, '#4a9eff');

    frame;
  end
end

begin
  player(100, 200);
  loop
    frame;
  end
end`;

    runDivDemo({
      canvas: 'gameCanvas',
      source,
      clearColor: '#0b1117',
      onError: (err) => {
        console.error(err);
      }
    });
  </script>
</body>
</html>
