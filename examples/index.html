<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS - Platformer Example</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container { text-align: center; }
    h1 { color: #fff; margin-bottom: 20px; font-size: 2em; }
    canvas {
      border: 4px solid #4a9eff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
    }
    .info { color: #aaa; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 DivJS Platformer</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info">Arrow Keys to move | SPACE to jump</div>
  </div>
  
  <script type="module">
    import { runDivDemo } from '../divjs.js';

    // The DIV program lives in playground/programs/platformer-basic.div, shared with the
    // online playground so there is a single copy of it.
    const source = await (await fetch('../playground/programs/platformer-basic.div')).text();

    runDivDemo({
      canvas: 'gameCanvas',
      source,
      clearColor: '#0b1117',
      onError: (err) => {
        console.error(err);
      }
    });
  </script>
</body>
</html>
