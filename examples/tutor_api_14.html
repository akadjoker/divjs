<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS API Tutorial 14 - Mouse & Input</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a111a;
      color: #d7e6f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 12px;
    }
    canvas {
      display: block;
      border: 1px solid #2b4158;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0e1a29;
    }
    p {
      color: #93aecd;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      text-align: center;
      max-width: 640px;
      line-height: 1.5;
    }
    #log {
      width: 640px;
      max-width: 100%;
      background: #0f1b2a;
      border: 1px solid #2a3f55;
      padding: 8px;
      min-height: 40px;
      color: #9bc8f2;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="480"></canvas>
  <p>
    Tutorial 14: demonstra mouse tracking e input básico.<br>
    APIs: <code>mouse_x()</code>, <code>mouse_y()</code>, <code>mouse_button()</code>, <code>key()</code>.
  </p>
  <div id="log">booting...</div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const SOURCE = `PROGRAM tutor_api_14;

GLOBAL g_lib = 0;
GLOBAL g_click_count = 0;

PROCESS mouse_cursor();
BEGIN
  x = 320; y = 240;
  width = 16; height = 16;
  file = g_lib;
  graph = 200;

  LOOP
    x = mouse.x;
    y = mouse.y;

    // Adiciona posição ao trail
    g_mouse_trail[g_trail_index] = x;
    g_mouse_trail[g_trail_index + 1] = y;
    g_trail_index = g_trail_index + 2;
    IF (g_trail_index >= 40) g_trail_index = 0; END

    // Desenha trail
    g_i = 0;
    FOR (g_i = 0; g_i < 20; g_i = g_i + 1)
      g_idx = (g_trail_index - 2 - (g_i * 2) + 40) % 40;
      IF (g_mouse_trail[g_idx] <> 0)
        g_alpha = 255 - (g_i * 12);
        set_color(155, 200, 242);
        draw_circle(g_mouse_trail[g_idx], g_mouse_trail[g_idx + 1], 3 - g_i / 7);
      END
    END

    FRAME;
  END
END

PROCESS click_tracker();
BEGIN
  x = 0; y = 0;
  width = 32; height = 32;
  file = g_lib;
  graph = 100;
  g_prev_left = 0;
  g_prev_right = 0;

  LOOP
    // Detecta clique esquerdo (edge detection)
    IF (mouse.left = 1 AND g_prev_left = 0)
      g_click_count = g_click_count + 1;
      g_click_x[g_click_idx] = mouse.x;
      g_click_y[g_click_idx] = mouse.y;
      g_click_idx = g_click_idx + 1;
      IF (g_click_idx >= 10) g_click_idx = 0; END

      // Cria visualização do clique
      x = mouse.x; y = mouse.y;
      size = 100;
      graph = 100;

      // Desaparece gradualmente
      g_fade = 0;
      FOR (g_fade = 0; g_fade < 20; g_fade = g_fade + 1)
        size = size - 5;
        FRAME;
      END
      size = 0;
      signal(get_id(), s_kill);
    END

    // Detecta clique direito
    IF (mouse.right = 1 AND g_prev_right = 0)
      g_click_count = g_click_count + 1;
      x = mouse.x; y = mouse.y;
      size = 100;
      graph = 103;

      // Desaparece gradualmente
      g_fade = 0;
      FOR (g_fade = 0; g_fade < 20; g_fade = g_fade + 1)
        size = size - 5;
        FRAME;
      END
      size = 0;
      signal(get_id(), s_kill);
    END

    g_prev_left = mouse.left;
    g_prev_right = mouse.right;

    FRAME;
  END
END

PROCESS keyboard_display();
BEGIN
  LOOP
    // Mostra última tecla pressionada
    g_sc = scan_code();
    IF (g_sc <> 0)
      g_last_key = g_sc;
    END

    // Mostra scroll
    IF (mouse.scroll <> 0)
      g_scroll_value = g_scroll_value + mouse.scroll;
    END

    FRAME;
  END
END

PROCESS info_display();
BEGIN
  LOOP
    set_color('#9bc8f2');
    text(12, 8, "Tutorial 14 - mouse / keyboard / input");

    // Informações do mouse
    set_color('#93aecd');
    text(12, 30, "Mouse: x=" + mouse.x + " y=" + mouse.y);
    
    IF (mouse.left)
      set_color('#ff6b6b');
      text(12, 45, "Left click: YES");
    ELSE
      set_color('#5a6a7a');
      text(12, 45, "Left click: NO");
    END

    IF (mouse.right)
      set_color('#ff6b6b');
      text(12, 60, "Right click: YES");
    ELSE
      set_color('#5a6a7a');
      text(12, 60, "Right click: NO");
    END

    set_color('#93aecd');
    text(12, 75, "Scroll: " + g_scroll_value);
    text(12, 90, "Clicks: " + g_click_count);

    // Última tecla
    IF (g_last_key <> 0)
      set_color('#ffd93d');
      text(12, 115, "Last key: " + g_last_key);
    END

    // Estatísticas de keys
    set_color('#5a6a7a');
    local keys_info = "Active keys: ";
    IF (key(_up))    keys_info = keys_info + "UP ";    END
    IF (key(_down))  keys_info = keys_info + "DOWN ";  END
    IF (key(_left))  keys_info = keys_info + "LEFT ";  END
    IF (key(_right)) keys_info = keys_info + "RIGHT "; END
    IF (key(_space)) keys_info = keys_info + "SPACE "; END
    text(12, 140, keys_info);

    // Scroll info
    set_color('#93aecd');
    text(12, 440, "Use mouse scroll to test scroll input");
    text(12, 455, "Press keys to see scan codes");

    FRAME;
  END
END

BEGIN
  set_mode(640, 480);
  screen_color('#0e1a29');

  g_lib = load_fpg('../assets/div-support/help.fpg');
  put_screen(g_lib, 1);

  // Inicializa trail
  local i = 0;
  FOR (i = 0; i < 40; i = i + 1)
    g_mouse_trail[i] = 0;
  END

  mouse_cursor();
  click_tracker();
  keyboard_display();
  info_display();

  LOOP FRAME; END
END`;

    const log = document.getElementById('log');
    runDivDemo({
      canvas: document.getElementById('c'),
      source: SOURCE,
      clearColor: '#0e1a29',
      onLog: (line) => { log.textContent = line; },
      onError: (err) => { log.textContent = 'error: ' + (err?.message || String(err)); }
    });
  </script>
</body>
</html>
