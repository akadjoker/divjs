<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS -Tutorial 0</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2em;
    }

    canvas {
      border: 4px solid #4a9eff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
    }

    .info {
      color: #aaa;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 DivJS Tutorial 0</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="log">booting...</div>
  </div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const source = `
    
PROGRAM Tutorial_1;
BEGIN
    load_fpg('../assets/div-support/tutor0.fpg');
    put_screen(0,2);  // Sets graphic number 2 as screen background
    ship();
    LOOP
        // If a random number between 0 and 100 is minor than 30, then creates
        // an "enemy" type process on top of screen
        IF (rand(0,100)<30)
            enemy(rand(0,800),rand(-4,4),rand(6,12));
        END
        FRAME;        // Shows next image
    END
END

//-----------------------------------------------------------------------
// Handles player's ship
//-----------------------------------------------------------------------

PROCESS ship()
BEGIN
    graph=1; x=160; y=480;    // Selects graphic and it's coordinates

    LOOP
        x=mouse.x;            // Puts ship on x mouse coordinate
        IF (mouse.left)       // When the left mouse button is pressed
            shot(x,y-20);     // creates a "shot" type process
        END
        FRAME;                // Shows next ship image
    END
END

//-----------------------------------------------------------------------
// Handles ship's shots
// Entries: Graphic's coordinates
//-----------------------------------------------------------------------

PROCESS shot(x,y)
BEGIN
    graph=3;    // Selects graphic

    REPEAT
        y-=16;  // Moves it upwards 16 points
        FRAME;  // Shows next image
    UNTIL (y<0) // Repeats until it reaches top screen end
END

//-----------------------------------------------------------------------
// Enemies that fall from top of screen
// Entries: x coordinate, x increment, and y increment (for each image)
//-----------------------------------------------------------------------

PROCESS enemy(x,inc_x,inc_y)
BEGIN
  y=-20;              // Places graphic on top of screen
  size=rand(25,100);  // Sets it's size randomly (between 25% and 100%)
  graph=4;            // Selects a graphic for the process (the 4th on file)

    REPEAT
      x+=inc_x;         // Adds x increment to x coordinate
      y+=inc_y;         // Same thing with y coordinate
      FRAME;
    // Repeats until it gets out of screen or collides with a shot
    UNTIL (y>600 OR collision(TYPE shot));

    FROM graph=5 TO 10; // Prints an explosion on enemy's position
        FRAME;          // (explosion's graphics range from the 5th to the 10th)
    END
END


`;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const log = document.getElementById('log');

    let statusLine = '';
    function logLine(line) {
      console.log(line);
      log.textContent = statusLine ? `${line}  ||  ${statusLine}` : line;
    }

    try {
      runDivDemo({
        canvas,
        source: source,
        clearColor: '#000',
        onLog: (line) => { logLine(line); },
        onFrame: ({ runtime }) => {
          const fps = Math.round(runtime.fpsValue || 0);
          const procs = runtime.vm?.processManager?.getAll?.() || [];
          const active = procs.filter(p => p.active && !p.suspended && !p.dead);

        },
        onError: (err) => {
          logLine('error: ' + (err?.message || String(err)));
          console.error(err);
        }
      });
    } catch (err) {
      logLine('error: ' + (err?.message || String(err)));
      console.error(err);
    }
  </script>
</body>

</html>
