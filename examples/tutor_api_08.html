<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DivJS API Tutorial 08 - Collision Shapes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a111a;
      color: #d7e6f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: "Fira Sans", "Segoe UI", sans-serif;
      padding: 12px;
    }
    canvas {
      display: block;
      border: 1px solid #2b4158;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0e1a29;
    }
    p {
      color: #93aecd;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      text-align: center;
      max-width: 640px;
      line-height: 1.5;
    }
    #log {
      width: 640px;
      max-width: 100%;
      background: #0f1b2a;
      border: 1px solid #2a3f55;
      padding: 8px;
      min-height: 40px;
      color: #9bc8f2;
      font: 12px "JetBrains Mono", "Consolas", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="480"></canvas>
  <p>
    Tutorial 08: define caixas e círculos de colisão personalizados.<br>
    APIs: <code>set_collision_shape()</code>, <code>add_collision_box()</code>,
    <code>add_collision_circle()</code>, <code>collision()</code>.
  </p>
  <div id="log">booting...</div>

  <script type="module">
    import { runDivDemo } from '../divjs.js';

    const SOURCE = `PROGRAM tutor_api_08;

GLOBAL g_lib = 0;
GLOBAL g_score = 0;
GLOBAL g_hit = 0;

PROCESS player();
BEGIN
  x = 100; y = 240;
  width = 32; height = 32;
  file = g_lib;
  graph = 100;       // Bola

  // Hitbox circular em torno do centro
  set_collision_shape('circle');
  set_collision_radius(12);

  LOOP
    IF (key(_left))  x = x - 3; END
    IF (key(_right)) x = x + 3; END
    IF (key(_up))    y = y - 3; END
    IF (key(_down))  y = y + 3; END

    g_hit = collision(TYPE enemy);
    IF (g_hit <> 0)
      g_score = g_score + 1;
      signal(g_hit, s_kill);
    END

    FRAME;
  END
END

PROCESS enemy(px, py, code);
BEGIN
  x = px; y = py;
  width = 64; height = 64;
  file = g_lib;
  graph = 103;       // Bola gris
  size = 50;         // 32x32 visual

  // Caixa de colisão personalizada (maior que a aparência para demonstrar)
  set_collision_shape(0);   // box default
  clear_collision_boxes();
  add_collision_box(16, 16, 32, 32, code);

  LOOP
    FRAME;
  END
END

BEGIN
  set_mode(640, 480);
  screen_color('#0e1a29');

  g_lib = load_fpg('../assets/div-support/help.fpg');
  put_screen(g_lib, 7);   // Fondo figuras

  player();
  enemy(400, 120, 11);
  enemy(520, 240, 12);
  enemy(400, 360, 13);

  LOOP
    set_color('#9bc8f2');
    text(12, 8, "Tutorial 08 - set_collision_shape / add_collision_box");
    text(12, 22, "score=" + g_score + "  last_hit=" + g_hit);
    FRAME;
  END
END`;

    const log = document.getElementById('log');
    runDivDemo({
      canvas: document.getElementById('c'),
      source: SOURCE,
      clearColor: '#0e1a29',
      onLog: (line) => { log.textContent = line; },
      onError: (err) => { log.textContent = 'error: ' + (err?.message || String(err)); }
    });
  </script>
</body>
</html>
